name: Solver Closeout Validation

on:
  push:
    branches:
      - solver-closeout

permissions:
  contents: read

concurrency:
  group: solver-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          echo "GIT_DIFF_CHECK=PASS"

      - name: Install Ninja
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip -o ninja.zip
          7z x ninja.zip -o"$GITHUB_WORKSPACE/ninja"
          echo "$GITHUB_WORKSPACE/ninja" >> "$GITHUB_PATH"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v3.7.4

      - name: Setup Geode SDK
        shell: bash
        run: |
          set -euo pipefail
          export CLI_PROFILE="${{ github.workspace }}/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods" "$CLI_PROFILE/Contents/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win
          geode sdk install "${{ github.workspace }}/geode-sdk-clone"
          export GEODE_SDK="${{ github.workspace }}/geode-sdk-clone"
          echo "GEODE_SDK=$GEODE_SDK" >> "$GITHUB_ENV"
          geode sdk update "5.10.1"
          geode sdk install-binaries --platform win --version "5.10.1"

      - name: Configure redesigned solver
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DGEODE_DONT_INSTALL_MODS=ON `
            -DGEODE_TARGET_PLATFORM=Win64 `
            -DAUTOBOT_BUILD_SOLVER_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "REAL_GEODE_CONFIGURE=PASS"

      - name: Functional reachability gates
        shell: pwsh
        run: |
          cmake --build build --config Release --target autobot-build4-functional-tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./build/autobot-build4-functional-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Flight recorder flush gate
        shell: pwsh
        run: |
          cmake --build build --config Release --target autobot-flight-recorder-test --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./build/autobot-flight-recorder-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Crash recorder main-worker concurrency gate
        shell: pwsh
        run: |
          cmake --build build --config Release --target autobot-crash-recorder-concurrency-test --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./build/autobot-crash-recorder-concurrency-test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Baseline solve performance profile
        shell: pwsh
        run: |
          cmake --build build --config Release --target autobot-solve-perf-profile --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./build/autobot-solve-perf-profile.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "SOLVE_PROFILE_BASELINE_CAPTURED=PASS"

      - name: Architecture and hardcode gates
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()
          cmake = (root / "CMakeLists.txt").read_text(encoding="utf-8")
          test_src = (root / "tests/build4/ReachabilityFunctionalTest.cpp").read_text(encoding="utf-8")

          if 'file(GLOB_RECURSE SOURCES CONFIGURE_DEPENDS src/*.cpp)' in cmake:
              raise SystemExit("OLD AUTOBOT SOURCE GLOB IS STILL ACTIVE")
          if 'AUTOBOT_GDSOLVER_ROOT}/src/*.cpp' not in cmake:
              raise SystemExit("PINNED REACHABILITY SOLVER IS NOT THE ACTIVE MOD SOURCE")
          print("OLD_SYSTEM_REMOVED_FROM_INPUT_PATH=PASS")

          forbidden_local = [
              "Stereo Madness",
              "solution_lv1",
              "percentage -> click",
              "percent -> click",
              "known click timestamp",
              "level ID -> clicks",
          ]
          active_local = cmake + "\n" + test_src
          for token in forbidden_local:
              if token.lower() in active_local.lower():
                  raise SystemExit(f"LOCAL LEVEL HARDCODE TOKEN FOUND: {token}")
          print("NO_LEVEL_HARDCODE_TEST=PASS")

          deps = root / "build" / "_deps"
          candidates = list(deps.glob("autobot_gdsolver_upstream-src"))
          if len(candidates) != 1:
              raise SystemExit(f"EXPECTED ONE PINNED GDSOLVER SOURCE TREE, FOUND {len(candidates)}")
          upstream = candidates[0]

          dp_root = upstream / "dp" / "src"
          forbidden_dp = [
              "#include <Geode",
              '#include "Geode',
              "GJBaseGameLayer::update(",
              "PlayLayer::update(",
              "createCheckpoint(",
              "loadFromCheckpoint(",
          ]
          for path in dp_root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in forbidden_dp:
                  if token in text:
                      raise SystemExit(f"DP SEARCH TOUCHES LIVE GD: {path}: {token}")
          print("SEARCH_BRANCHING_INTERNAL_GD_UPDATE_CALLS=0")
          print("SEARCH_GAME_BOUNDARY_TEST=PASS")

          repair = (upstream / "src/mod/repair.hpp").read_text(encoding="utf-8")
          required = ["AnchorRow", "dpbridge::solve", "fixup", "anchor"]
          missing = [token for token in required if token not in repair]
          if missing:
              raise SystemExit("PINNED REPAIR LOOP MISSING EXPECTED PRIMITIVES: " + ", ".join(missing))
          print("REAL_GAME_REPAIR_PATH_AUDIT=PASS")

          # Public/custom lifecycle: inspect the exact FetchContent source tree
          # after our deterministic configure-time patches have been applied.
          config = (upstream / "src/mod/config.hpp").read_text(encoding="utf-8")
          planio = (upstream / "src/mod/plan_io.hpp").read_text(encoding="utf-8-sig")
          hooks = (upstream / "src/mod/hooks_playlayer.cpp").read_text(encoding="utf-8")
          session = (upstream / "src/mod/session.hpp").read_text(encoding="utf-8")
          repair = (upstream / "src/mod/repair.hpp").read_text(encoding="utf-8")

          lifecycle_required = {
              "retain level ownership": "if (level) level->retain();" in config,
              "release old level ownership": "if (old) old->release();" in config,
              "clear progress level on session reset": "clearProgressLevel();" in planio,
              "custom init checkpoint": "PUBLIC_PLAY_ENTER" in hooks,
              "session configure begin": "SESSION_CONFIG_BEGIN" in session,
              "session configure end": "SESSION_CONFIG_END" in session,
              "before original init": "PRE_ORIGINAL_PLAYLAYER_INIT" in hooks,
              "after original init": "POST_ORIGINAL_PLAYLAYER_INIT" in hooks,
              "rebind to PlayLayer level": "this->m_level ? this->m_level : level" in hooks,
              "solver start begin": "SOLVER_START_BEGIN" in repair,
              "solver start end": "SOLVER_START_END" in repair,
              "level reset checkpoint": "LEVEL_RESET" in hooks,
              "level quit checkpoint": "LEVEL_QUIT" in hooks,
              "session end checkpoint": "SESSION_END" in session,
          }
          bad = [name for name, ok in lifecycle_required.items() if not ok]
          if bad:
              raise SystemExit("CUSTOM LIFECYCLE INVARIANT MISSING: " + ", ".join(bad))

          init_pos = hooks.index("bool init(GJGameLevel* level")
          init_end = hooks.index("void onQuit()", init_pos)
          init_body = hooks[init_pos:init_end]
          custom_pos = init_body.index("if (custom)")
          original_pos = init_body.index("const bool ok = PlayLayer::init", custom_pos)
          custom_config_pos = init_body.index("configureSession(true)", original_pos)
          rebind_pos = init_body.index("bindProgressLevel(liveLevel)", custom_config_pos)
          if not (custom_pos < original_pos < custom_config_pos < rebind_pos):
              raise SystemExit("CUSTOM LEVEL POST-INIT LIFECYCLE ORDER IS WRONG")
          pre_original = init_body[custom_pos:original_pos]
          for token in ["configureSession(true)", "bindProgressLevel(", "sampleProgress("]:
              if token in pre_original:
                  raise SystemExit("CUSTOM PRE-INIT AUTOBOT SIDE EFFECT FOUND: " + token)
          print("CUSTOM_LEVEL_PREINIT_SIDE_EFFECT_TEST=PASS")

          all_src = ""
          for path in (upstream / "src").rglob("*"):
              if path.is_file():
                  try:
                      all_src += path.read_text(encoding="utf-8", errors="ignore")
                  except OSError:
                      pass
          if all_src.count("uiConfigureSession(") != 2:
              raise SystemExit("EXPECTED EXACTLY ONE uiConfigureSession CALL SITE PLUS DEFINITION")
          if init_body.count("configureSession(true)") != 1:
              raise SystemExit("CUSTOM LEVEL CONFIGURE CALL COUNT IS NOT ONE")
          print("CUSTOM_LEVEL_SINGLE_SESSION_CONFIG_TEST=PASS")

          if "this->m_level ? this->m_level : level" not in init_body[original_pos:]:
              raise SystemExit("CUSTOM POST-INIT LIVE LEVEL REBIND MISSING")
          if "CUSTOM_LEVEL_POINTERS" not in init_body[original_pos:]:
              raise SystemExit("CUSTOM POINTER AUDIT MISSING")
          print("CUSTOM_LEVEL_POSTINIT_BIND_TEST=PASS")
          print("CUSTOM_LEVEL_SESSION_LIFECYCLE_TEST=PASS")

          checkpoints = [
              "PUBLIC_PLAY_ENTER", "PRE_UI_CONFIGURE", "POST_UI_CONFIGURE",
              "PRE_OPEN_FILES", "POST_OPEN_FILES", "PRE_SESSION_FLAGS",
              "POST_SESSION_FLAGS", "PLAYLAYER_INIT_HOOK_ENTER",
              "PRE_ORIGINAL_PLAYLAYER_INIT", "POST_ORIGINAL_PLAYLAYER_INIT",
              "POST_LEVEL_REBIND", "PRE_SOLVER_START", "POST_SOLVER_START",
              "PRE_LEVEL_MODEL_BUILD", "POST_LEVEL_MODEL_BUILD",
              "PRE_OBJECT_EXTRACTION", "POST_OBJECT_EXTRACTION",
              "PRE_INITIAL_SEARCH", "POST_INITIAL_SEARCH",
              "PRE_CANDIDATE_VERIFY", "POST_CANDIDATE_VERIFY",
              "PRE_FAST_MODE_ENABLE", "POST_FAST_MODE_ENABLE",
              "FIRST_REAL_GJ_UPDATE", "FIRST_RENDER_AFTER_INIT",
              "FIRST_VISIBILITY_UPDATE",
          ]
          generated = config + "\n" + session + "\n" + hooks + "\n" + repair
          gamelayer = (upstream / "src/mod/hooks_gamelayer.cpp").read_text(encoding="utf-8")
          generated += "\n" + gamelayer
          missing_checkpoints = [x for x in checkpoints if x not in generated]
          if missing_checkpoints:
              raise SystemExit("FLIGHT RECORDER CHECKPOINTS MISSING: " + ", ".join(missing_checkpoints))
          if "autobot-crash-trace.txt" not in config or "AUTOBOT_CRASH_TRACE" not in config:
              raise SystemExit("FLIGHT RECORDER FILE/LOG DUPLICATION MISSING")
          print("FLIGHT_RECORDER_CHECKPOINT_SET_TEST=PASS")

          solver_header = (upstream / "src/solver/solver.hpp").read_text(encoding="utf-8")
          model_phases = [
              "PRE_POIS_DUMP", "POST_POIS_DUMP",
              "PRE_OBJECTS_DUMP", "POST_OBJECTS_DUMP",
              "PRE_OBJRECTS_DUMP", "POST_OBJRECTS_DUMP",
              "PRE_OBB_DUMP", "POST_OBB_DUMP",
              "PRE_FORCEBLOCKS_DUMP", "POST_FORCEBLOCKS_DUMP",
              "PRE_TRIGGERS_DUMP", "POST_TRIGGERS_DUMP",
              "PRE_ROTGAMEPLAY_DUMP", "POST_ROTGAMEPLAY_DUMP",
              "PRE_LEVELSETTINGS_DUMP", "POST_LEVELSETTINGS_DUMP",
              "POST_BUILDPOIS_EXPORTS",
          ]
          phase_positions = []
          for token in model_phases:
              if token not in solver_header:
                  raise SystemExit("CUSTOM MODEL BUILD PHASE CHECKPOINT MISSING: " + token)
              phase_positions.append(solver_header.index(token))
          if phase_positions != sorted(phase_positions):
              raise SystemExit("CUSTOM MODEL BUILD PHASE ORDER IS WRONG")
          print("CUSTOM_MODEL_BUILD_PHASE_TEST=PASS")

          objrect_start = solver_header.index("inline void writeObjRects")
          objrect_end = solver_header.index("// Extract orb POIs", objrect_start)
          objrect_body = solver_header[objrect_start:objrect_end]
          unsafe_casts = [
              "static_cast<TeleportPortalObject*>(obj)",
              "static_cast<EffectGameObject*>(obj)",
              "static_cast<RotateGameplayGameObject*>(obj)",
              "static_cast<GameOptionsTrigger*>(obj)",
              "static_cast<GameObject*>(grp->objectAtIndex(0))",
          ]
          remaining = [x for x in unsafe_casts if x in objrect_body]
          if remaining:
              raise SystemExit("UNSAFE OBJRECT CAST REMAINS: " + ", ".join(remaining))
          required_safe = [
              "typeinfo_cast<TeleportPortalObject*>(obj)",
              "typeinfo_cast<EffectGameObject*>(obj)",
              "typeinfo_cast<RotateGameplayGameObject*>(obj)",
              "typeinfo_cast<GameOptionsTrigger*>(obj)",
              "typeinfo_cast<GameObject*>(raw)",
          ]
          missing_safe = [x for x in required_safe if x not in objrect_body]
          if missing_safe:
              raise SystemExit("SAFE OBJRECT CAST GUARD MISSING: " + ", ".join(missing_safe))
          if "OBJRECT_TYPE_MISMATCH" not in objrect_body or "OBJRECT_SPECIAL" not in objrect_body:
              raise SystemExit("OBJRECT SPECIAL-OP DIAGNOSTIC MISSING")
          print("CUSTOM_OBJRECT_SAFE_CAST_TEST=PASS")

          geometry_pairs = [
              ("PRE_POIS_DUMP", "POST_POIS_DUMP"),
              ("PRE_OBJECTS_DUMP", "POST_OBJECTS_DUMP"),
              ("PRE_OBJRECTS_DUMP", "POST_OBJRECTS_DUMP"),
              ("PRE_OBB_DUMP", "POST_OBB_DUMP"),
              ("PRE_FORCEBLOCKS_DUMP", "POST_FORCEBLOCKS_DUMP"),
              ("PRE_TRIGGERS_DUMP", "POST_TRIGGERS_DUMP"),
              ("PRE_ROTGAMEPLAY_DUMP", "POST_ROTGAMEPLAY_DUMP"),
              ("PRE_LEVELSETTINGS_DUMP", "POST_LEVELSETTINGS_DUMP"),
          ]
          for pre, post in geometry_pairs:
              if solver_header.index(pre) >= solver_header.index(post):
                  raise SystemExit(f"GEOMETRY EXPORT LIFECYCLE BROKEN: {pre} !< {post}")
          if "obj->m_groups->size()" not in solver_header:
              raise SystemExit("GROUP VECTOR BOUNDS GUARD MISSING")
          if "POST_BUILDPOIS_EXPORTS" not in solver_header:
              raise SystemExit("BUILDPOIS RETURN CHECKPOINT MISSING")
          print("CUSTOM_GEOMETRY_EXPORT_LIFECYCLE_TEST=PASS")

          start_pos = repair.index("inline void start(GJBaseGameLayer* l)")
          start_end = repair.index("// One line per iteration", start_pos)
          start_body = repair[start_pos:start_end]

          post_csv_required = [
              "POST_GCSV_BUILD",
              "PRE_LOAD_MODE_PORTALS", "POST_LOAD_MODE_PORTALS",
              "PRE_LOAD_ROT_OBJS", "POST_LOAD_ROT_OBJS",
              "PRE_ROTSEED_RESET", "POST_ROTSEED_RESET",
              "PRE_CHECK_SUBSCRIBE", "POST_CHECK_SUBSCRIBE",
              "PRE_CANCEL_SEARCH_START", "POST_CANCEL_SEARCH_START",
              "PRE_PATH_INIT", "POST_PATH_INIT",
              "PRE_DIRECTORY_CLEANUP", "POST_DIRECTORY_CLEANUP",
              "PRE_STALE_FILE_CLEANUP", "POST_STALE_FILE_CLEANUP",
              "PRE_RUN_STATE_RESET", "POST_RUN_STATE_RESET",
              "PRE_HORIZON_INIT", "POST_HORIZON_INIT",
              "PRE_ANCHORS_RESET", "POST_ANCHORS_RESET",
              "PRE_START_RESULT_WRITE", "POST_START_RESULT_WRITE",
              "PRE_BOOTSTRAP_CHECK", "POST_BOOTSTRAP_CHECK",
              "PRE_BEGIN_FIRST_ATTEMPT", "POST_BEGIN_FIRST_ATTEMPT",
          ]
          missing_post_csv = [x for x in post_csv_required if x not in start_body]
          if missing_post_csv:
              raise SystemExit("SOLVER START POST-CSV CHECKPOINT MISSING: " + ", ".join(missing_post_csv))
          for token in post_csv_required:
              pos = start_body.index(token)
              tail = start_body[pos:pos + 220]
              if "thread=MAIN" not in tail:
                  raise SystemExit("SOLVER START MAIN THREAD TAG MISSING NEAR: " + token)
          print("SOLVER_START_POST_CSV_PHASE_TEST=PASS")

          main_sequence = [
              "POST_GCSV_BUILD",
              "PRE_LOAD_MODE_PORTALS", "POST_LOAD_MODE_PORTALS",
              "PRE_LOAD_ROT_OBJS", "POST_LOAD_ROT_OBJS",
              "PRE_ROTSEED_RESET", "POST_ROTSEED_RESET",
              "PRE_CHECK_SUBSCRIBE", "POST_CHECK_SUBSCRIBE",
              "PRE_CANCEL_SEARCH_START", "POST_CANCEL_SEARCH_START",
              "PRE_PATH_INIT", "POST_PATH_INIT",
              "PRE_DIRECTORY_CLEANUP", "POST_DIRECTORY_CLEANUP",
              "PRE_STALE_FILE_CLEANUP", "POST_STALE_FILE_CLEANUP",
              "PRE_RUN_STATE_RESET",
              "PRE_HORIZON_INIT", "POST_HORIZON_INIT",
              "POST_RUN_STATE_RESET",
              "PRE_ANCHORS_RESET", "POST_ANCHORS_RESET",
              "PRE_START_RESULT_WRITE", "POST_START_RESULT_WRITE",
              "PRE_BOOTSTRAP_CHECK", "POST_BOOTSTRAP_CHECK",
              "PRE_BEGIN_FIRST_ATTEMPT", "POST_BEGIN_FIRST_ATTEMPT",
          ]
          seq_pos = [start_body.index(x) for x in main_sequence]
          if seq_pos != sorted(seq_pos):
              raise SystemExit("SOLVER START INIT CHECKPOINT ORDER IS WRONG")
          if not (
              start_body.index("PRE_LOAD_MODE_PORTALS") < start_body.index("loadModePortals(g_csv)")
              < start_body.index("POST_LOAD_MODE_PORTALS")
          ):
              raise SystemExit("loadModePortals IS NOT BRACKETED")
          if not (
              start_body.index("PRE_LOAD_ROT_OBJS") < start_body.index("loadRotObjs(g_csv)")
              < start_body.index("POST_LOAD_ROT_OBJS")
          ):
              raise SystemExit("loadRotObjs IS NOT BRACKETED")
          if not (
              start_body.index("PRE_ROTSEED_RESET") < start_body.index("rotSeedLevelReset()")
              < start_body.index("POST_ROTSEED_RESET")
          ):
              raise SystemExit("rotSeedLevelReset IS NOT BRACKETED")
          print("SOLVER_START_INIT_SEQUENCE_TEST=PASS")

          spawn_pos = repair.index("inline void spawn(int kind")
          spawn_end = repair.index("// What begins the run:", spawn_pos)
          spawn_body = repair[spawn_pos:spawn_end]
          handoff_required = [
              "SPAWN_ENTER",
              "PRE_SPAWN_STATE_RESET", "POST_SPAWN_STATE_RESET",
              "PRE_CK_MUTEX_RESET", "POST_CK_MUTEX_RESET",
              "PRE_SPAWN_CANCEL_SEARCH", "POST_SPAWN_CANCEL_SEARCH",
              "PRE_THREAD_CREATE", "POST_THREAD_CREATE",
              "WORKER_ENTER",
              "PRE_PLAN_REMOVE", "POST_PLAN_REMOVE",
              "PRE_BASE_ARGS", "POST_BASE_ARGS",
              "PRE_LOG_SOLVER_ARGS", "POST_LOG_SOLVER_ARGS",
              "PRE_INITIAL_SEARCH", "POST_INITIAL_SEARCH",
          ]
          missing_handoff = [x for x in handoff_required if x not in spawn_body]
          if missing_handoff:
              raise SystemExit("SOLVER WORKER HANDOFF CHECKPOINT MISSING: " + ", ".join(missing_handoff))
          main_handoff = [
              "SPAWN_ENTER", "PRE_SPAWN_STATE_RESET", "POST_SPAWN_STATE_RESET",
              "PRE_CK_MUTEX_RESET", "POST_CK_MUTEX_RESET",
              "PRE_SPAWN_CANCEL_SEARCH", "POST_SPAWN_CANCEL_SEARCH",
              "PRE_THREAD_CREATE", "POST_THREAD_CREATE",
          ]
          worker_handoff = [
              "WORKER_ENTER", "PRE_PLAN_REMOVE", "POST_PLAN_REMOVE",
              "PRE_BASE_ARGS", "POST_BASE_ARGS",
              "PRE_LOG_SOLVER_ARGS", "POST_LOG_SOLVER_ARGS",
              "PRE_INITIAL_SEARCH", "POST_INITIAL_SEARCH",
          ]
          for token in main_handoff:
              p = spawn_body.index(token)
              if "thread=MAIN" not in spawn_body[p:p + 220]:
                  raise SystemExit("MAIN THREAD TAG MISSING NEAR: " + token)
          for token in worker_handoff:
              p = spawn_body.index(token)
              if "thread=WORKER" not in spawn_body[p:p + 220]:
                  raise SystemExit("WORKER THREAD TAG MISSING NEAR: " + token)
          worker_seq = [spawn_body.index(x) for x in worker_handoff]
          if worker_seq != sorted(worker_seq):
              raise SystemExit("WORKER HANDOFF CHECKPOINT ORDER IS WRONG")
          if not (
              spawn_body.index("PRE_THREAD_CREATE")
              < spawn_body.index("std::thread([kind, arg, gen, workerTracePath]")
              < spawn_body.index("WORKER_ENTER")
          ):
              raise SystemExit("THREAD CREATION/WORKER ENTRY IS NOT BRACKETED")
          if not (
              spawn_body.index("PRE_BASE_ARGS") < spawn_body.index("baseArgs(g_planPath)")
              < spawn_body.index("POST_BASE_ARGS")
          ):
              raise SystemExit("baseArgs IS NOT BRACKETED")
          if "logSolverArgs(a0)" in spawn_body:
              raise SystemExit("UNSAFE logSolverArgs CALL REMAINS IN FIRST-SOLVE WORKER")
          if not (
              spawn_body.index("PRE_LOG_SOLVER_ARGS")
              < spawn_body.index("POST_LOG_SOLVER_ARGS")
              < spawn_body.index("PRE_INITIAL_SEARCH")
          ):
              raise SystemExit("WORKER REPORTING BYPASS/INITIAL SEARCH ORDER IS WRONG")
          if not (
              spawn_body.index("PRE_INITIAL_SEARCH") < spawn_body.index("dpbridge::solveInProcess(g_csv, a0)")
              < spawn_body.index("POST_INITIAL_SEARCH")
          ):
              raise SystemExit("INITIAL solveInProcess IS NOT BRACKETED")
          print("SOLVER_WORKER_HANDOFF_TEST=PASS")

          flight = (root / "src/diagnostics/flight_recorder_core.hpp").read_text(encoding="utf-8")
          durable_required = ["std::fwrite", "std::fflush", "_commit(_fileno(file))", "std::fclose"]
          missing_durable = [x for x in durable_required if x not in flight]
          if missing_durable:
              raise SystemExit("DURABLE MAIN FLIGHT RECORDER PRIMITIVE MISSING: " + ", ".join(missing_durable))

          worker_durable = [
              "appendWorkerCrashSafeLine", "std::mutex", "CreateFileW",
              "FILE_APPEND_DATA", "WriteFile", "FlushFileBuffers", "CloseHandle", "noexcept"
          ]
          missing_worker_durable = [x for x in worker_durable if x not in flight]
          if missing_worker_durable:
              raise SystemExit("DURABLE WORKER RECORDER PRIMITIVE MISSING: "
                               + ", ".join(missing_worker_durable))

          missing_main_crashtrace = [
              x for x in post_csv_required + main_handoff
              if ("crashTrace" not in (start_body if x in post_csv_required else spawn_body)[
                    max(0, (start_body if x in post_csv_required else spawn_body).index(x) - 120):
                    (start_body if x in post_csv_required else spawn_body).index(x) + 300
                 ])
          ]
          if missing_main_crashtrace:
              raise SystemExit("MAIN START FLIGHT CHECKPOINT NOT EMITTED THROUGH crashTrace: "
                               + ", ".join(missing_main_crashtrace))

          missing_worker_trace = [
              x for x in worker_handoff
              if "workerCrashTrace" not in spawn_body[
                    max(0, spawn_body.index(x) - 180):spawn_body.index(x) + 360
                 ]
          ]
          if missing_worker_trace:
              raise SystemExit("WORKER CHECKPOINT NOT EMITTED THROUGH PRIVATE RECORDER: "
                               + ", ".join(missing_worker_trace))
          print("SOLVER_START_FLIGHT_CHECKPOINT_TEST=PASS")

          config_worker_pos = config.index("inline void workerCrashTrace")
          config_worker_end = config.index("inline void crashTraceOnce", config_worker_pos)
          worker_diag_helper = config[config_worker_pos:config_worker_end]
          bad_worker_diag = [
              x for x in ["log::", "resolveDataDir", "geode::", "cocos2d::"]
              if x in worker_diag_helper
          ]
          if bad_worker_diag:
              raise SystemExit("WORKER DIAGNOSTICS TOUCH GEODE/MAIN LOGGER: "
                               + ", ".join(bad_worker_diag))

          worker_lambda_pos = spawn_body.index("std::thread([kind, arg, gen, workerTracePath]")
          worker_lambda_end = spawn_body.index("}).detach();", worker_lambda_pos)
          worker_lambda = spawn_body[worker_lambda_pos:worker_lambda_end]
          if 'crashTrace("' in worker_lambda or "log::" in worker_lambda:
              raise SystemExit("WORKER LAMBDA STILL USES MAIN/GEODE DIAGNOSTIC LOGGER")
          if "autobot-worker-crash-trace.txt" not in spawn_body:
              raise SystemExit("PRIVATE WORKER CRASH TRACE PATH MISSING")
          if "autobot-crash-trace.txt" in worker_lambda:
              raise SystemExit("WORKER STILL REFERENCES MAIN CRASH TRACE PATH")
          if "logSolverArgs(a0)" in worker_lambda:
              raise SystemExit("FIRST-SOLVE WORKER STILL RUNS logSolverArgs")
          print("WORKER_DIAGNOSTICS_NO_GEODE_LOG_TEST=PASS")

          hud = (upstream / "src/mod/hud.hpp").read_text(encoding="utf-8")
          panel = (upstream / "src/mod/ui_panel.hpp").read_text(encoding="utf-8")
          for token in ["GDSOLVER BOT - SOLVING", "GDSOLVER BOT - REPLAY"]:
              if token in hud:
                  raise SystemExit("LEGACY GDSOLVER HUD BRANDING STILL COMPILED: " + token)
          if "AutoBotT7 Solver" not in hud:
              raise SystemExit("AUTOBOT HUD BRANDING MISSING")
          if 'CCLabelBMFont::create("GDSOLVER"' in panel:
              raise SystemExit("LEGACY GDSOLVER PANEL BRANDING STILL COMPILED")
          if 'CCLabelBMFont::create("AutoBotT7"' not in panel:
              raise SystemExit("AUTOBOT PANEL BRANDING MISSING")
          if not (root / "THIRD_PARTY_GDSOLVER_LICENSE.txt").exists():
              raise SystemExit("GDSOLVER MIT ATTRIBUTION FILE MISSING")
          print("AUTOBOT_BRANDING_TEST=PASS")

      - name: Compile and package redesigned AutoBot
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dll = Get-ChildItem -Recurse build -Filter "thiago7tv.autobot-t7.dll" | Select-Object -First 1
          $geode = Get-ChildItem -Recurse build -Filter "*.geode" | Select-Object -First 1
          if (-not $dll) { throw "AutoBot DLL not produced" }
          if (-not $geode) { throw "Geode package not produced" }

          Write-Host "REAL_GEODE_COMPILE_PACKAGE=PASS"
          Write-Host "ONE_SOLVER_INPUT_AUTHORITY=PASS"

      - name: Prepare public-level stability candidate
        shell: bash
        run: |
          set -euo pipefail
          GEODE_SOURCE="$(find build -type f -name '*.geode' -print -quit)"
          test -n "$GEODE_SOURCE"

          mkdir -p runtime-candidate
          cp "$GEODE_SOURCE" runtime-candidate/AutoBot-T7-public-level-stability-v5.geode
          SHA256="$(sha256sum runtime-candidate/AutoBot-T7-public-level-stability-v5.geode | awk '{print $1}')"

          cat > runtime-candidate/RUNTIME-CANDIDATE-REPORT.txt <<EOF
          AUTOBOT T7 — PUBLIC LEVEL STABILITY V5 CANDIDATE
          FINAL_SOLVER_CLOSEOUT_COMMIT=${GITHUB_SHA}
          RUN_ID=${GITHUB_RUN_ID}
          SOURCE_BRANCH=${GITHUB_REF_NAME}
          SHA256=${SHA256}

          SOLVER REDESIGN = REACHABILITY + REAL GD VERIFICATION/REPAIR
          PINNED UPSTREAM = gdsolver/gdsolver@4fb6a2365d3623b211913a5a21de308e49c5fce2
          LICENSE = MIT
          OLD MPC/GLOBAL/UNIVERSAL INPUT PATH = NOT BUILT

          REACHABILITY_BASIC_JUMP_TEST = PASS
          REPLAY_SAME_PLAN_TEST = PASS
          DIVERGENCE_REANCHOR_TEST = PASS
          NO_LEVEL_HARDCODE_TEST = PASS
          COLD_SOLVE_GENERATED_LEVEL_TEST = PASS
          SEARCH BRANCHING INTERNAL GD UPDATE CALLS = 0
          GIT DIFF CHECK = PASS
          REAL GEODE CONFIGURE = PASS
          REAL GEODE COMPILE/PACKAGE = PASS
          SOLVER_START_POST_CSV_PHASE_TEST = PASS
          SOLVER_START_INIT_SEQUENCE_TEST = PASS
          SOLVER_WORKER_HANDOFF_TEST = PASS
          SOLVER_START_FLIGHT_CHECKPOINT_TEST = PASS

          STEREO MADNESS 0-100 COLD RUNTIME = PENDING USER RUNTIME
          UNIVERSAL GD SOLVER = NOT DECLARED

          FAILED RUNTIME BUILDS = 2 / 5
          REMAINING = 3 / 5

          PUBLIC RELEASE = NO
          GEODE INDEX = UNTOUCHED
          EOF

          printf '%s\n' "${GITHUB_SHA}" > runtime-candidate/SOURCE-COMMIT.txt
          sha256sum runtime-candidate/AutoBot-T7-public-level-stability-v5.geode > runtime-candidate/SHA256SUMS.txt

          echo "RUNTIME_CANDIDATE_SHA256=$SHA256"
          echo "PUBLIC_LEVEL_STABILITY_CANDIDATE_PREPARED=PASS"

      - name: Upload public-level stability candidate
        uses: actions/upload-artifact@v4
        with:
          name: AutoBot-T7-public-level-stability-v5
          path: runtime-candidate/
          if-no-files-found: error
          retention-days: 14
