name: AutoBot T7 v0.1 Model Truth Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows / GD 2.2081 / Geode 5.10.1
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Initialize diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs ci-artifacts
          printf 'NOT_RUN\n' > ci-logs/static-tests-result.txt
          printf 'NOT_RUN\n' > ci-logs/general-solver-result.txt
          printf 'NOT_RUN\n' > ci-logs/model-truth-result.txt
          printf 'NOT_RUN\n' > ci-logs/action-countdown-result.txt
          printf 'NOT_RUN\n' > ci-logs/configure-exit-code.txt
          printf 'NOT_RUN\n' > ci-logs/build-exit-code.txt
          : > ci-logs/static-tests.log
          : > ci-logs/model-truth-tests.log
          : > ci-logs/action-countdown-test.log
          : > ci-logs/configure.log
          : > ci-logs/build.log
          HEAD_SHA="$(git rev-parse HEAD)"
          printf 'HEAD_SHA=%s\nGITHUB_SHA=%s\n' "$HEAD_SHA" "$GITHUB_SHA" | tee ci-logs/source-commit.txt
          test "$HEAD_SHA" = "$GITHUB_SHA"

      - name: Install Ninja
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip -o ninja.zip
          7z x ninja.zip -o"$GITHUB_WORKSPACE/ninja"
          echo "$GITHUB_WORKSPACE/ninja" >> "$GITHUB_PATH"

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: v3.7.4

      - name: Setup Geode SDK 5.10.1
        shell: bash
        run: |
          set -euo pipefail
          export CLI_PROFILE="${{ github.workspace }}/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods" "$CLI_PROFILE/Contents/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win
          geode sdk install "${{ github.workspace }}/geode-sdk-clone"
          export GEODE_SDK="${{ github.workspace }}/geode-sdk-clone"
          echo "GEODE_SDK=$GEODE_SDK" >> "$GITHUB_ENV"
          TARGET_GEODE_VERSION="$(jq -r '.geode' mod.json)"
          geode sdk update "$TARGET_GEODE_VERSION"
          geode sdk install-binaries --platform win --version "$TARGET_GEODE_VERSION"
          {
            echo "GITHUB_SHA=$GITHUB_SHA"
            cmake --version
            clang++ --version
            ninja --version
            geode --version
            echo "GEODE_SDK=$GEODE_SDK"
          } 2>&1 | tee ci-logs/toolchain.txt

      - name: Run invariant and Model Truth gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-tests
          run_test() {
            local name="$1"; shift
            echo "=== $name ===" | tee -a ci-logs/static-tests.log
            "$@" 2>&1 | tee -a ci-logs/static-tests.log
          }
          clang++ -std=c++23 -Wall -Wextra -Werror -Iinclude tests/SpatialHashInvariantTest.cpp src/world/SpatialHash.cpp -o ci-tests/spatial.exe
          run_test SPATIAL_HASH_INVARIANTS ./ci-tests/spatial.exe
          clang++ -std=c++23 -Wall -Wextra -Werror -Iinclude tests/CollisionWorldInvariantTest.cpp src/world/SpatialHash.cpp src/world/CollisionWorld.cpp src/world/CollisionQueryAudit.cpp -o ci-tests/collision.exe
          run_test COLLISION_WORLD_QUERY_INVARIANTS ./ci-tests/collision.exe
          clang++ -std=c++23 -Wall -Wextra -Werror -Iinclude tests/DynamicColliderSyncInvariantTest.cpp src/world/SpatialHash.cpp src/world/CollisionWorld.cpp -o ci-tests/dynamic.exe
          run_test DYNAMIC_COLLIDER_SYNC_INVARIANTS ./ci-tests/dynamic.exe
          clang++ -std=c++23 -Wall -Wextra -Werror -Iinclude tests/InputControllerStateMachineTest.cpp -o ci-tests/input.exe
          run_test INPUT_CONTROLLER_STATE_MACHINE ./ci-tests/input.exe
          clang++ -std=c++23 -Wall -Wextra -Werror -Iinclude tests/GeneralSolverInvariantTest.cpp src/solver/ActionGenerator.cpp src/solver/PhysicsModels.cpp src/solver/TrajectoryScorer.cpp -o ci-tests/general-solver.exe
          run_test GENERAL_SOLVER_INVARIANTS ./ci-tests/general-solver.exe
          printf 'PASS\n' > ci-logs/general-solver-result.txt

          COMMON="src/world/SpatialHash.cpp src/world/CollisionWorld.cpp src/solver/LocalWorldView.cpp src/solver/PhysicsValidationHarness.cpp src/solver/PhysicsModels.cpp src/solver/TrajectorySimulator.cpp src/solver/TrajectoryScorer.cpp src/solver/ActionGenerator.cpp src/solver/RealtimePlanner.cpp src/control/AutonomousTestDriver.cpp"
          clang++ -std=c++23 -Wall -Wextra -Werror -Iinclude tests/ModelTruthTest.cpp $COMMON -o ci-tests/model-truth.exe
          echo '=== MODEL_TRUTH_TESTS ===' | tee -a ci-logs/static-tests.log ci-logs/model-truth-tests.log
          ./ci-tests/model-truth.exe 2>&1 | tee -a ci-logs/static-tests.log ci-logs/model-truth-tests.log
          printf 'PASS\n' > ci-logs/model-truth-result.txt

          clang++ -std=c++23 -Wall -Wextra -Werror -Iinclude tests/ActionCountdownTest.cpp $COMMON -o ci-tests/action-countdown.exe
          echo '=== ACTION_COUNTDOWN_TEST ===' | tee -a ci-logs/static-tests.log ci-logs/action-countdown-test.log
          ./ci-tests/action-countdown.exe 2>&1 | tee -a ci-logs/static-tests.log ci-logs/action-countdown-test.log
          printf 'PASS\n' > ci-logs/action-countdown-result.txt
          printf 'PASS\n' > ci-logs/static-tests-result.txt

      - name: Configure and build real Geode mod
        if: always()
        shell: bash
        run: |
          set +e
          echo '=== REAL GEODE CONFIGURE ===' | tee ci-logs/configure.log
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ '-DGEODE_CODEGEN_CMAKE_ARGS=-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja' -G Ninja -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=Win64 '-DCMAKE_CXX_FLAGS=-Wall -Wextra' 2>&1 | tee -a ci-logs/configure.log
          CONFIGURE_CODE=${PIPESTATUS[0]}
          printf '%s\n' "$CONFIGURE_CODE" > ci-logs/configure-exit-code.txt
          BUILD_CODE=NOT_RUN
          if [ "$CONFIGURE_CODE" -eq 0 ]; then
            echo '=== REAL GEODE BUILD ===' | tee ci-logs/build.log
            cmake --build build --config Release --verbose --parallel 2 2>&1 | tee -a ci-logs/build.log
            BUILD_CODE=${PIPESTATUS[0]}
          else
            echo "Build skipped: configure failed ($CONFIGURE_CODE)" | tee ci-logs/build.log
          fi
          printf '%s\n' "$BUILD_CODE" > ci-logs/build-exit-code.txt
          find build -type f -print 2>/dev/null | sort > ci-logs/build-files.txt || true
          GEODE_FILE="$(find build -type f -name '*.geode' -print -quit 2>/dev/null)"
          if [ -n "$GEODE_FILE" ]; then cp "$GEODE_FILE" ci-artifacts/AutoBot-T7-v0.1.geode; fi
          exit 0

      - name: Package reproducible evidence
        if: always()
        shell: bash
        run: |
          set +e
          BUILD_COMMIT="$(git rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
          git archive --format=zip --output=ci-artifacts/AutoBot-T7-v0.1-source.zip "$GITHUB_SHA"
          ARCHIVE_CODE=$?
          STATIC="$(tr -d '\r\n ' < ci-logs/static-tests-result.txt 2>/dev/null)"
          GENERAL="$(tr -d '\r\n ' < ci-logs/general-solver-result.txt 2>/dev/null)"
          MODEL="$(tr -d '\r\n ' < ci-logs/model-truth-result.txt 2>/dev/null)"
          COUNTDOWN="$(tr -d '\r\n ' < ci-logs/action-countdown-result.txt 2>/dev/null)"
          CONFIGURE="$(tr -d '\r\n ' < ci-logs/configure-exit-code.txt 2>/dev/null)"
          BUILD="$(tr -d '\r\n ' < ci-logs/build-exit-code.txt 2>/dev/null)"
          LINK=FAIL; PACKAGE=FAIL; SOURCE_BINARY=FAIL
          find build -type f -name 'thiago7tv.autobot-t7.dll' -size +0c -print -quit 2>/dev/null | grep -q . && LINK=PASS
          grep -Fq 'Successfully packaged thiago7tv.autobot-t7.geode' ci-logs/build.log 2>/dev/null && [ -s ci-artifacts/AutoBot-T7-v0.1.geode ] && PACKAGE=PASS
          [ "$BUILD_COMMIT" = "$GITHUB_SHA" ] && [ "$ARCHIVE_CODE" -eq 0 ] && [ -s ci-artifacts/AutoBot-T7-v0.1-source.zip ] && SOURCE_BINARY=PASS
          cat > ci-artifacts/BUILD-REPORT.txt <<EOF
          AUTOBOT T7 V0.1 - MODEL TRUTH FIX
          FINAL COMMIT: $GITHUB_SHA
          RUN ID: $GITHUB_RUN_ID
          BUILD COMMIT: $BUILD_COMMIT
          STATIC INVARIANTS: $STATIC
          GENERAL_SOLVER_INVARIANTS: $GENERAL
          MODEL_TRUTH_TESTS: $MODEL
          ACTION_COUNTDOWN_TEST: $COUNTDOWN
          REAL CONFIGURE: $CONFIGURE
          REAL COMPILE: $BUILD
          REAL LINK: $LINK
          REAL PACKAGE: $PACKAGE
          SOURCE / BINARY COMMIT MATCH: $SOURCE_BINARY

          ROOT CAUSE FIX: raw GD normalized velocity is converted using runtime-observed real dx / real dt / raw velocity; raw velocity is never directly multiplied by seconds.
          BOT HOLD AUTHORITY: InputController::botHolding
          FALSE SAFE HISTORY: 120 samples
          HORIZON INCONCLUSIVE: NOT SAFE
          ACTION COUNTDOWN: absolute target sample; delayed PRESS cannot slide forward forever

          GENERAL SOLVER GAMEPLAY = PENDING USER RETEST
          MODEL TRUTH GATE = PENDING USER RETEST
          EOF
          cp ci-logs/build.log ci-artifacts/build.log
          cp ci-logs/model-truth-tests.log ci-artifacts/model-truth-test.log
          cp ci-logs/action-countdown-test.log ci-artifacts/action-countdown-test.log
          mkdir -p ci-artifacts/ci-logs
          cp -R ci-logs/. ci-artifacts/ci-logs/
          (cd ci-artifacts && : > SHA256SUMS.txt && for f in AutoBot-T7-v0.1.geode AutoBot-T7-v0.1-source.zip BUILD-REPORT.txt build.log model-truth-test.log action-countdown-test.log; do [ -s "$f" ] && sha256sum "$f" >> SHA256SUMS.txt; done)
          printf 'ARCHIVE_CODE=%s\nLINK=%s\nPACKAGE=%s\nSOURCE_BINARY=%s\n' "$ARCHIVE_CODE" "$LINK" "$PACKAGE" "$SOURCE_BINARY" > ci-logs/final-gate.txt
          exit 0

      - name: Upload reproducible artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoBot-T7-v0.1-reproducible
          path: ci-artifacts/
          if-no-files-found: error

      - name: Enforce final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n ' < ci-logs/static-tests-result.txt)" = PASS
          test "$(tr -d '\r\n ' < ci-logs/general-solver-result.txt)" = PASS
          test "$(tr -d '\r\n ' < ci-logs/model-truth-result.txt)" = PASS
          test "$(tr -d '\r\n ' < ci-logs/action-countdown-result.txt)" = PASS
          test "$(tr -d '\r\n ' < ci-logs/configure-exit-code.txt)" = 0
          test "$(tr -d '\r\n ' < ci-logs/build-exit-code.txt)" = 0
          grep -q '^LINK=PASS$' ci-logs/final-gate.txt
          grep -q '^PACKAGE=PASS$' ci-logs/final-gate.txt
          grep -q '^SOURCE_BINARY=PASS$' ci-logs/final-gate.txt
          test -s ci-artifacts/AutoBot-T7-v0.1.geode
          test -s ci-artifacts/AutoBot-T7-v0.1-source.zip
          echo 'SPATIAL_HASH_INVARIANTS=PASS'
          echo 'COLLISION_WORLD_QUERY_INVARIANTS=PASS'
          echo 'DYNAMIC_COLLIDER_SYNC_INVARIANTS=PASS'
          echo 'INPUT_CONTROLLER_STATE_MACHINE=PASS'
          echo 'GENERAL_SOLVER_INVARIANTS=PASS'
          echo 'MODEL_TRUTH_TESTS=PASS'
          echo 'ACTION_COUNTDOWN_TEST=PASS'
          echo 'REAL CONFIGURE=PASS'
          echo 'REAL COMPILE=PASS'
          echo 'REAL LINK=PASS'
          echo 'REAL PACKAGE=PASS'
          echo 'SOURCE/BINARY REPRODUCIBILITY=PASS'
