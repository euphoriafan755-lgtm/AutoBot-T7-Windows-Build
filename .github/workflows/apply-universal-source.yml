name: Apply AutoBot Universal Solver Source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-source:
    if: github.event.head_commit.message == 'Bootstrap universal solver source application'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact prepared source tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: 0c8c4da0bafc04b13909f853ecc4c00556af1f32
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$PATCH_BLOB_SHA" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/universal-patch.zip
          unzip -oq /tmp/universal-patch.zip -d "$GITHUB_WORKSPACE"
          rm -f .github/workflows/apply-universal-source.yml
          git diff --check
          git status --short

      - name: Amend into single universal solver commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "euphoriafan755-lgtm"
          git config user.email "euphoriafan755@gmail.com"
          git add -A
          git diff --cached --check
          git commit --amend -m "Integrate general world, causal triggers and dual joint planning"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA"
          git push --force origin HEAD:general-solver-v01
